name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Copy Files
        run: |
          cordova create myApp com.kuran.pro "KuranDinlePro"
          
          # Ana dizindeki tüm web dosyalarını myApp/www içine kopyala
          cp -r *.html *.css *.js myApp/www/ 2>/dev/null || true
          
          # Varsa www veya assets klasörlerini kopyala
          if [ -d "www" ]; then cp -r www/* myApp/www/; fi
          if [ -d "assets" ]; then cp -r assets myApp/www/; fi

          # config.xml dosyasını kopyala
          if [ -f config.xml ]; then cp config.xml myApp/config.xml; fi

      - name: Build Android APK
        run: |
          cd myApp
          cordova platform add android
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
          
