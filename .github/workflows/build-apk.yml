name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Generate app icons from assets/icon.png
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open("assets/icon.png").convert("RGB")
          w, h = src.size
          bg = src.getpixel((min(60, w - 1), min(60, h - 1)))
          if w != h:
              # Yatay logo: kulaklikli Kuran amblemini kare olarak kirp
              s = int(h * 600 / 768)
              cx, cy = int(w * 675 / 1408), int(h * 340 / 768)
              src = src.crop((cx - s // 2, cy - s // 2, cx + s // 2, cy + s // 2))
          os.makedirs("res/icon/android", exist_ok=True)
          for d, px in {"ldpi": 36, "mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              src.resize((px, px), Image.LANCZOS).save(f"res/icon/android/{d}.png")
          for d, px in {"ldpi": 81, "mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}.items():
              src.resize((px, px), Image.LANCZOS).save(f"res/icon/android/{d}-foreground.png")
              Image.new("RGB", (px, px), bg).save(f"res/icon/android/{d}-background.png")
          if not os.path.exists("www/logo.png"):
              src.resize((384, 384), Image.LANCZOS).save("www/logo.png")
          print("icons ok", os.listdir("res/icon/android"))
          PY

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Check www/index.html
        run: |
          ls -la www
          test -f www/index.html

      - name: Fix config.xml (remove invalid color and adaptive icon settings)
        run: |
          sed -i '/BackgroundColor/d;/foreground=/d' config.xml
          cat config.xml

      - name: Build Android APK
        run: |
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Export APK
        run: |
          mkdir -p output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk output/KuranDinlePro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: output/KuranDinlePro.apk
