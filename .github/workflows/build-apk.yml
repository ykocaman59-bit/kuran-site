name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp -r *.html *.css *.js www/ 2>/dev/null || true
          if [ -d "assets" ]; then cp -r assets www/; fi

      - name: Build Android Platform
        run: |
          cordova platform add android
          cordova build android --debug

      - name: Move APK to Root
        run: |
          mkdir -p output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk output/KuranDinlePro.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: output/KuranDinlePro.apk
          
