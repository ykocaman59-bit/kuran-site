name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Check www/index.html
        run: |
          ls -la www
          test -f www/index.html

      - name: Build Android APK
        run: |
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Export APK
        run: |
          mkdir -p output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk output/KuranDinlePro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: output/KuranDinlePro.apk
