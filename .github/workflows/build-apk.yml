name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clean Previous Builds
        run: |
          rm -rf android www node_modules package-lock.json capacitor.config.*

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          INDEX_PATH=$(find . -maxdepth 3 -iname "index.html" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            cp "$INDEX_PATH" www/index.html
          fi

      - name: Generate Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.kurandinlepro.app",
            "appName": "KURAN DINLE PRO",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Install Dependencies & Add Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kuran-dinle-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
