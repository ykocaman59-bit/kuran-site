name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Sync Web Files to Cordova Root
        run: |
          mkdir -p www
          # Kök dizindeki HTML, JS, CSS ve ilgili tüm dosyaları www içine kopyala
          cp -R *.html *.js *.css *.json assets/ js/ css/ www/ 2>/dev/null || true
          # Eğer ana dosya farklı bir klasördeyse oradan kopyalamayı dene
          if [ ! -f "www/index.html" ]; then
            find . -maxdepth 2 -name "index.html" -exec cp {} www/index.html \;
          fi

      - name: Build Android Platform
        run: |
          cordova platform add android
          cordova prepare android
          cordova build android --debug

      - name: Export APK
        run: |
          mkdir -p output
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk output/KuranDinlePro.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: output/KuranDinlePro.apk
          
