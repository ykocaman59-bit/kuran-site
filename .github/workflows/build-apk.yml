name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Move Files
        run: |
          cordova create myApp com.kuran.pro "KuranDinlePro"
          cp -r www/* myApp/www/
          if [ -f config.xml ]; then cp config.xml myApp/config.xml; fi

      - name: Build Android APK
        run: |
          cd myApp
          cordova platform add android
          cordova build android --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: ./**/*.apk
          
