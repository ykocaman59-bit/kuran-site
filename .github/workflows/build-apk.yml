name: Build Android APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Locate and Prepare HTML
        run: |
          mkdir -p www
          INDEX_PATH=$(find . -maxdepth 3 -iname "index.html" | head -n 1)
          if [ -n "$INDEX_PATH" ]; then
            cp "$INDEX_PATH" www/index.html
          else
            echo "<html><body><h1>Index bulunamadi</h1></body></html>" > www/index.html
          fi

      - name: Setup Capacitor CLI
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npx cap init "KURAN DINLE PRO" "com.kurandinlepro.app" --web-dir www
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kuran-dinle-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
