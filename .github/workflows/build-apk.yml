name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Copy Files
        run: |
          cordova create myApp com.kuran.pro "KuranDinlePro"
          
          # HTML/CSS/JS/Assets aktarma
          cp -r *.html *.css *.js myApp/www/ 2>/dev/null || true
          if [ -d "www" ]; then cp -r www/* myApp/www/; fi
          if [ -d "assets" ]; then cp -r assets myApp/www/; fi

          # config.xml aktarma
          if [ -f config.xml ]; then cp config.xml myApp/config.xml; fi

      - name: Build Android Platform
        run: |
          cd myApp
          cordova platform add android
          cordova build android --debug

      - name: Move APK to Root
        run: |
          mkdir -p output
          find myApp/platforms/android -name "*.apk" -exec cp {} output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuranDinlePro-APK
          path: output/*.apk
          
